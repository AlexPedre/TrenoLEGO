{if(!VoiceLang)return 0;VoiceLang=VoiceLang.toLowerCase();for(let i=0;i<ttsPreferredLanguages.length;i++){const pref=ttsPreferredLanguages[i].toLowerCase();if(VoiceLang===pref)return 500-i*100;if(VoiceLang.startsWith(pref.split("-")[0]))return 250-i*100;}
return 0;}
function ttsQualityScore(v)
{const Name=(v.name||"").toLowerCase();let Score=ttsLanguageMatchScore(v.lang);if(Name.includes("neural"))Score+=50;if(Name.includes("google"))Score+=40;if(Name.includes("enhanced"))Score+=30;if(Name.includes("premium"))Score+=20;if(v.default)Score+=10;return Score;}
function ttsFindBestVoice()
{const Voices=speechSynthesis.getVoices();if(!Voices.length)return;const Sorted=[...Voices].sort((a,b)=>ttsQualityScore(b)-ttsQualityScore(a));ttsVoice=Sorted[0];}
function ttsSpeak(Text,CallBackAtEnd)
{if(!ttsAvailable)return;speechSynthesis.cancel();const Utterance=new SpeechSynthesisUtterance(Text);if(ttsVoice){Utterance.voice=ttsVoice;Utterance.lang=ttsVoice.lang;}else{Utterance.lang=ttsPreferredLanguages[0];}
Utterance.volume=1.0;Utterance.onstart=function(){sttEnable(false);};Utterance.onend=function(){sttEnable(true);if(CallBackAtEnd)CallBackAtEnd();};speechSynthesis.speak(Utterance);}
